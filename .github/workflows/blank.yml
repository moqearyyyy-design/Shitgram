name: Build Shitgram APK
on:
  workflow_dispatch:
  push:
    branches: [master]
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - uses: android-actions/setup-android@v3
        with:
          api-level: 36
          ndk-version: '27.2.12479018'
          cmake-version: '3.22.1'
      - name: Build Standalone APK
        run: |
          chmod +x gradlew
          ./gradlew :TMessagesProj_App:assembleStandalone --no-daemon -Dorg.gradle.jvmargs="-Xmx4g"
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: shitgram-apk
          path: TMessagesProj_App/build/outputs/apk/standalone/app.apk
          retention-days: 7
